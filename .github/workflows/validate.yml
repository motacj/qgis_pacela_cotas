name: Validate QGIS plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q __init__.py core.py dialog.py plugin.py tests

      - name: Build QGIS ZIP
        run: python tools/build_plugin.py

      - name: Validate QGIS ZIP
        run: python tools/validate_qgis_package.py dist/qgis_pacela_cotas.zip

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: qgis_pacela_cotas
          path: dist/qgis_pacela_cotas.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build QGIS ZIP
        run: python tools/build_plugin.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qgis_pacela_cotas.zip
          generate_release_notes: true
